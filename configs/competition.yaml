experiment:
  name: multiscale_density_moe_competition_vitl448_v1
  # Multiscale-density checkpoints use a wider difficulty estimator input.
  output_dir: outputs/multiscale_density_moe_competition_vitl448_v1
  seed: 20260803

dataset:
  type: competition_folders
  train_dir: data/competition/Train
  test_dir: data/competition/Test_A
  categories: all
  category_limit: null
  expected_categories: 50
  expected_train_samples_per_category: 20
  expected_test_samples_per_category: 15
  image_size: 448
  crop_size: 448
  train_mode: all_views

model:
  # Preserve upstream Dinomaly2; modify only the competition bottleneck.
  architecture: difficulty_moe_dinomaly2
  backbone: dinov2reg_vit_large_14
  backbone_weights_dir: third_party/Dinomaly2/backbones/weights
  dropout: 0.2
  linear_attention: true
  loose_constraint_groups: 2
  loose_loss: true
  context_aware_recenter: true
  information_density:
    # Both windows exclude the center token. Their variance and disagreement
    # help distinguish complex normal structures from simple regions.
    context_scales: [3, 5]
    # The first 64 channels always remain open. Context-predicted difficulty
    # continuously opens the next 64 and final 128 channels.
    hidden_dim: 64
    channel_widths: [64, 128, 256]
    channel_thresholds: [0.33, 0.66]
    channel_temperature: 0.08
    # Difficulty is measured relative to an EMA of normal reconstruction error.
    difficulty_z_threshold: 0.5
    difficulty_temperature: 0.5
    target_budget: 0.3
    # Learn difficulty with the original 256-channel path before changing capacity.
    capacity_warmup_steps: 1500
    capacity_ramp_steps: 1000
    residual_ema_decay: 0.99
    initial_expected_error: 0.1
    # Subtract only a bounded, difficulty-weighted part of expected normal error.
    calibration_blend: 0.35
    moe:
      # Low/mid/high experts receive progressively wider latent prefixes.
      expert_input_widths: [64, 128, 256]
      expert_hidden_dims: [1024, 2048, 4096]
      routing_centers: [0.17, 0.50, 0.83]
      routing_temperature: 0.10
      # First learn reconstruction and difficulty, then switch to sparse top-1.
      routing_warmup_steps: 1500
      routing_ramp_steps: 1000
      hard_routing_start_step: 2500
      target_load: [0.60, 0.30, 0.10]
    auxiliary_weights:
      difficulty_prediction: 1.0
      difficulty_budget: 0.1
      difficulty_smoothness: 0.01
      difficulty_mean: 0.0
      capacity_mid_usage: 0.0
      capacity_high_usage: 0.0
      moe_load_balance: 0.1
      moe_route_entropy: 0.01
      # Before sparse routing, teach low/mid experts the high expert's normal
      # reconstruction without allowing this loss to manipulate the router.
      moe_expert_distillation: 0.05
      moe_soft_low_usage: 0.0
      moe_soft_mid_usage: 0.0
      moe_soft_high_usage: 0.0
      moe_hard_low_usage: 0.0
      moe_hard_mid_usage: 0.0
      moe_hard_high_usage: 0.0
      local_complexity_mean: 0.0
      context_scale_disagreement: 0.0
  generalized:
    latent_dim: 384
    num_references: 512
    reference_top_k: 32
    reference_temperature: 0.1
    router_top_k: 3
    router_temperature: 1.0
    router_trim_ratio: 0.1
    expert_dropout: 0.1
    auxiliary_weights:
      reference_balance: 1.0
      router_balance: 1.0
      router_entropy_penalty: 0.05
      expert_diversity: 0.05
  multi_view:
    # Competition still consumes all five views, but Dinomaly2 processes each
    # view independently, matching the upstream multi-view training entrypoint.
    enabled: false
    num_views: 5
    context_dim: 384
    num_set_layers: 2
    num_heads: 6
    view_embedding: true
    view_dropout_probability: 0.2
    visibility_temperature: 1.0
    cross_view_dropout: 0.1
    # Official competition folders must contain exactly 0.png..4.png.
    missing_view_policy: error
    variance_target: 1.0

training:
  # Object batch 12 equals 60 views. Do not set this to the old view batch 64,
  # which would silently become 320 images per optimizer step.
  total_steps: 6000
  effective_batch_size: 12
  micro_batch_size: auto
  # Per GPU, measured by a real five-view forward/backward probe.
  batch_candidates: [3, 2, 1]
  memory_headroom_mb: 3000
  amp: true
  amp_dtype: bfloat16
  # 1e-3 became unstable when total_steps was extended to 15k. Start with
  # 3e-4; tune [1e-4, 3e-4, 5e-4] before changing the architecture.
  learning_rate: 0.0003
  first_bottleneck_lr_scale: 0.2
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  optimizer:
    # Supported: stable_adamw, adamw, adam.
    type: stable_adamw
    amsgrad: false
    stable_clip_threshold: 1.0
  scheduler:
    # Supported: cosine, linear, polynomial, constant, step, multistep.
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.05
    step_offset: 1
    # polynomial: power: 2.0
    # step: step_size: 1500, gamma: 0.5
    # multistep: milestones: [2500, 4500], gamma: 0.3
  # A slower, less aggressive Loose Loss avoids locking onto persistent
  # normal edges as the only hard tokens.
  loose_loss_warmup_steps: 2000
  loose_loss_final_discard: 0.7
  generalized_regularization_weight: 0.01
  information_density_regularization_weight: 0.1
  multi_view_auxiliary_weights:
    context_consistency: 0.01
    context_variance: 0.001
    visibility_balance: 0.001
    attention_entropy: 0.001
  gradient_clip_norm: 0.1
  gradient_guard:
    # The logged norm is measured before clipping. Skip only catastrophic
    # outliers; after three consecutive skips stop and preserve the last ckpt.
    skip_step_norm: 1.0
    max_consecutive_skips: 3
    fail_on_nonfinite: true
  log_every: 20
  checkpoint_every: 250
  auto_resume: true

evaluation:
  # Used by competition inference; no labels or local metrics are required.
  amp: true
  # Object batch; equivalent view batch is 10.
  batch_size: 2
  num_workers: 4
  resize_mask: 448
  image_top_ratio: 0.01
  object_top_ratio: 0.01
  gaussian_kernel_size: 5
  # Sigma 4 spreads a narrow edge response into a wide false-positive halo.
  gaussian_sigma: 2.0
  # Two Loose-Constraint feature groups: reduce the shallow/high-frequency
  # group and emphasize the deeper semantic group. [1, 1] is the old behavior.
  anomaly_map_layer_weights: [0.35, 0.65]
  anomaly_map_align_corners: false
  metric_bins: 1000
  resume: true
  normal_prior:
    enabled: true
    resolution: patch
    category_view_enabled: true
    unseen_fallback: view_global
    statistic: median_mad
    threshold: 2.0
    temperature: 0.5
    blend: 0.8
    eps: 1.0e-6
    batch_size: 2
    num_workers: 4

submission:
  mask_size: 448
  # Object batch; each item contains five independent output masks.
  batch_size: 2
  num_workers: 4
  object_top_ratio: 0.01
  # Per-category monotonic 8-bit calibration. The extreme upper quantile keeps
  # anomalous peaks from being collapsed while using the PNG range efficiently.
  lower_quantile: 0.001
  upper_quantile: 0.99999
  # Baseline option: legacy_concat_topk. Other options: max, softmax.
  object_score_aggregation: visibility_aware
  object_score_softmax_temperature: 0.25
  # Keep a max component so a defect visible in one camera is not erased.
  visibility_max_blend: 0.5

runtime:
  device: cuda:0
  multi_gpu_strategy: auto
  distributed_backend: auto
  device_ids: [0, 1]
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  deterministic: false
