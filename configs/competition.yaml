experiment:
  name: multiview_generalized_dinomaly_zeroshot_0907
  # Keep this run separate: scheduler/optimizer semantics are checkpoint-bound.
  output_dir: outputs/multiview_generalized_dinomaly_zeroshot_0907
  seed: 20260830

dataset:
  type: competition_folders
  train_dir: data/competition/Train
  test_dir: data/competition/Test_A
  categories: all
  category_limit: null
  # Test selection is independent so Test_B may contain categories absent from
  # Train. The default Test_A policy remains strict and backward compatible.
  test_categories: all
  test_category_limit: null
  require_same_categories: true
  expected_categories: 50
  expected_test_categories: 50
  expected_train_samples_per_category: 20
  expected_test_samples_per_category: 15
  image_size: 448
  crop_size: 448
  train_mode: all_views

model:
  # Keep the same category-generalized model used by run_unseen_pipeline.py.
  architecture: category_generalized
  backbone: dinov2reg_vit_large_14
  backbone_weights_dir: third_party/Dinomaly2/backbones/weights
  dropout: 0.2
  linear_attention: true
  loose_constraint_groups: 2
  loose_loss: true
  context_aware_recenter: true
  generalized:
    latent_dim: 384
    num_references: 512
    reference_top_k: 32
    reference_temperature: 0.1
    router_top_k: 3
    router_temperature: 1.0
    router_trim_ratio: 0.1
    expert_dropout: 0.1
    auxiliary_weights:
      reference_balance: 1.0
      router_balance: 1.0
      router_entropy_penalty: 0.05
      expert_diversity: 0.05
  multi_view:
    enabled: true
    num_views: 5
    context_dim: 384
    num_set_layers: 2
    num_heads: 6
    view_embedding: true
    view_dropout_probability: 0.2
    visibility_temperature: 1.0
    cross_view_dropout: 0.1
    # Official competition folders must contain exactly 0.png..4.png.
    missing_view_policy: error
    variance_target: 1.0

training:
  # Object batch 12 equals 60 views. Do not set this to the old view batch 64,
  # which would silently become 320 images per optimizer step.
  total_steps: 6000
  effective_batch_size: 12
  micro_batch_size: auto
  # Per GPU, measured by a real five-view forward/backward probe.
  batch_candidates: [3, 2, 1]
  memory_headroom_mb: 3000
  amp: true
  amp_dtype: bfloat16
  # Conservative peak LR for the large trainable decoder/reference/router.
  learning_rate: 0.0001
  first_bottleneck_lr_scale: 0.2
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  optimizer:
    # Supported: stable_adamw, adamw, adam.
    type: stable_adamw
    amsgrad: false
    stable_clip_threshold: 0.5
  scheduler:
    # 500-step linear warmup, then one half-cosine cycle to 5e-6.
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.05
    step_offset: 1
  # Ramp hard-token rejection more slowly than LR warmup so references first
  # learn the broad normal manifold before difficult normal edges are removed.
  loose_loss_warmup_steps: 1500
  loose_loss_final_discard: 0.7
  generalized_regularization_weight: 0.01
  multi_view_auxiliary_weights:
    context_consistency: 0.01
    context_variance: 0.001
    visibility_balance: 0.001
    attention_entropy: 0.001
  # 0.1 over-clips routine updates; 0.5 remains conservative for ViT-L.
  gradient_clip_norm: 0.5
  gradient_guard:
    # This 100M-parameter trainable stack starts around norm 170. Keep the
    # guard well above that normal regime; clipping handles routine gradients.
    skip_step_norm: 1000.0
    max_consecutive_skips: 3
    fail_on_nonfinite: true
  log_every: 20
  checkpoint_every: 500
  auto_resume: true

evaluation:
  # Used by competition inference; no labels or local metrics are required.
  amp: true
  # Object batch; equivalent view batch is 10.
  batch_size: 2
  num_workers: 4
  resize_mask: 448
  image_top_ratio: 0.01
  object_top_ratio: 0.01
  gaussian_kernel_size: 5
  # Sigma 4 spreads a narrow edge response into a wide false-positive halo.
  gaussian_sigma: 2.0
  # Two Loose-Constraint feature groups: reduce the shallow/high-frequency
  # group and emphasize the deeper semantic group. [1, 1] is the old behavior.
  anomaly_map_layer_weights: [0.35, 0.65]
  anomaly_map_align_corners: false
  metric_bins: 1000
  resume: true
  normal_prior:
    enabled: true
    resolution: patch
    category_view_enabled: true
    unseen_fallback: view_global
    statistic: median_mad
    threshold: 2.0
    temperature: 0.5
    blend: 0.8
    eps: 1.0e-6
    batch_size: 2
    num_workers: 4
  # Legacy inference-only fusion is disabled. The trained independent branch
  # below owns every category absent from Train.
  unseen_clip:
    enabled: false
    model_name: ViT-B-16
    pretrained: openai
    weights_dir: third_party/OpenCLIP/weights
    image_size: 448
    intermediate_layers: 4
    # Suppress shallow texture noise and favor the deeper semantic layers.
    intermediate_layer_weights: [0.1, 0.2, 0.3, 0.4]
    temperature: 0.07
    prompt_aggregation: topk_mean
    prompt_top_k: 3
    patch_smoothing_kernel: 3
    reconstruction_gain: 1.0
    semantic_gain: 1.0
    semantic_scale_floor: 0.02
    broken_threshold: 0.5
    upper_quantile: 0.995
    confidence_power: 2.0
    foreground_low_quantile: 0.2
    foreground_high_quantile: 0.7
    foreground_floor: 0.0
    foreground_dilation_kernel: 9
    final_gaussian_smoothing: true
    # Fit only on Train normals and use a category-agnostic prior per camera.
    normal_prior:
      enabled: true
      statistic: median_mad
      threshold: 2.0
      temperature: 0.5
      blend: 0.8
      eps: 1.0e-6
      mad_floor: 0.02
      batch_size: 2
      num_workers: 4
    normal_prompts:
      - a close-up photo of an intact industrial object
      - a normal undamaged component
      - a flawless object surface
      - a complete object without defects
      - a correctly assembled industrial component
      - an object with all parts present
      - a clean object without contamination
      - a component with correct wiring and connections
      - an object with a smooth uniform coating
      - an object with clear complete printed characters
      - a component with open unobstructed holes
      - an object with the correct shape and alignment
    broken_prompts:
      - a close-up photo of a broken industrial object
      - an industrial object with abrasion or a worn surface
      - an industrial object with missing or incomplete printed characters
      - an industrial object with discoloration or abnormal color
      - an industrial object with an exposed inner surface
      - an industrial object contaminated by glue or gelatinous residue
      - an industrial object contaminated by metallic debris
      - an industrial object with a pit or surface cavity
      - an industrial object with a scratch or gouge
      - an industrial object fitted with the wrong plug or wrong component
      - an industrial object with a broken or disconnected wire
      - a visibly damaged industrial component
      - an industrial object with excessive material or material overflow
      - an industrial object with fiber burrs or frayed fibers
      - an industrial object with a blocked or obstructed hole
      - an industrial object with a missing part or absent component
      - an industrial object with porosity, pores, or air holes
      - an industrial object with a twisted or tangled wire
      - an industrial object with a wire jumping out of its correct position
      - an industrial object with a burn mark or heat damage
      - an industrial object with deformation, warping, or bending
      - an industrial object with exposed copper or exposed conductor
      - an industrial object with a fracture, crack, or split
      - an industrial object with impact damage, denting, or crushing
      - an industrial object with an oil stain or greasy contamination
      - an industrial object with uneven coating or patchy paint
      - an industrial object with corrosion, oxidation, or rust
      - an industrial object with peeling, delamination, or flaking
      - an industrial object with a chip, notch, or broken edge
      - an industrial object with a puncture, tear, or unwanted hole
      - an industrial object with a loose connection or detached part
      - an industrial object with a bent pin or misaligned connector
      - an industrial object with foreign material, dirt, or contamination
      - an industrial object with an incorrect assembly or misplaced part

# AdaptCLIP-inspired branch trained locally from public OpenAI CLIP base
# weights. It never loads another anomaly model's task-specific checkpoint.
zero_shot:
  enabled: true
  backend: adaptclip_inspired
  route: unseen_only
  checkpoint: zero_shot/checkpoints/final_model.pt
  model:
    model_name: ViT-L-14-336
    pretrained: openai
    weights_dir: third_party/OpenCLIP/weights
    force_quick_gelu: true
    image_size: 518
    intermediate_layers: 4
    intermediate_layer_weights: [0.1, 0.2, 0.3, 0.4]
    semantic_temperature: 0.07
    adapter_hidden_dim: 192
    dropout: 0.1
    normal_prompts:
      - an intact industrial object
      - a flawless undamaged component
      - a correctly assembled object with all parts present
      - a clean uniform surface without defects
      - a normal object with correct shape and alignment
    broken_prompts:
      - a broken industrial object
      - a cracked fractured or split component
      - a scratched abraded chipped or dented surface
      - a component with missing displaced or incorrectly assembled parts
      - an object with deformation bending or crushing
      - an object with contamination stain glue debris or foreign material
      - an object with corrosion burn discoloration or peeling coating
      - a component with a blocked hole broken wire or bent connector
      - an object with excess material porosity pits or unwanted holes
      - a defective industrial component with a local anomaly
  training:
    total_steps: 8000
    object_batch_size: 2
    num_workers: 4
    amp: true
    amp_dtype: bfloat16
    optimizer: adamw
    learning_rate: 0.0002
    weight_decay: 0.0001
    adam_betas: [0.9, 0.999]
    scheduler: cosine
    warmup_steps: 400
    min_lr_ratio: 0.05
    gradient_clip_norm: 1.0
    focal_gamma: 2.0
    focal_weight: 1.0
    dice_weight: 1.0
    image_weight: 0.25
    clean_weight: 0.2
    prompt_anchor_weight: 0.01
    log_every: 20
    checkpoint_every: 500
    auto_resume: true
  synthesis:
    anomaly_probability: 0.75
    hard_normal_probability: 0.5
    scratch_probability: 0.35
    min_area_ratio: 0.002
    max_area_ratio: 0.18
    alpha_min: 0.45
    alpha_max: 0.95
    feature_anomaly_probability: 0.5
    feature_noise_std: 0.08

submission:
  mask_size: 448
  # Object batch; each item contains five independent output masks.
  batch_size: 2
  num_workers: 4
  object_top_ratio: 0.01
  # Per-category monotonic 8-bit calibration. The extreme upper quantile keeps
  # anomalous peaks from being collapsed while using the PNG range efficiently.
  lower_quantile: 0.001
  upper_quantile: 0.99999
  # Baseline option: legacy_concat_topk. Other options: max, softmax.
  object_score_aggregation: visibility_aware
  object_score_softmax_temperature: 0.25
  # Keep a max component so a defect visible in one camera is not erased.
  visibility_max_blend: 0.5

runtime:
  device: cuda:0
  multi_gpu_strategy: auto
  distributed_backend: auto
  device_ids: [0, 1]
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  deterministic: false
