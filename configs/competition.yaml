experiment:
  name: generalized_dinomaly_competition_seen50_vitl448_stable_v2
  # A new directory is intentional: do not resume the already destabilized run.
  output_dir: outputs/generalized_dinomaly_competition_seen50_vitl448_stable_v2
  seed: 20260803

dataset:
  type: competition_folders
  train_dir: data/competition/Train
  test_dir: data/competition/Test_A
  categories: all
  category_limit: null
  expected_categories: 50
  expected_train_samples_per_category: 20
  expected_test_samples_per_category: 15
  image_size: 448
  crop_size: 448
  train_mode: all_views

model:
  # Keep the same category-generalized model used by run_unseen_pipeline.py.
  architecture: category_generalized
  backbone: dinov2reg_vit_large_14
  backbone_weights_dir: third_party/Dinomaly2/backbones/weights
  dropout: 0.2
  linear_attention: true
  loose_constraint_groups: 2
  loose_loss: true
  context_aware_recenter: true
  generalized:
    latent_dim: 384
    num_references: 512
    reference_top_k: 32
    reference_temperature: 0.1
    router_top_k: 3
    router_temperature: 1.0
    router_trim_ratio: 0.1
    expert_dropout: 0.1
    auxiliary_weights:
      reference_balance: 1.0
      router_balance: 1.0
      router_entropy_penalty: 0.05
      expert_diversity: 0.05

training:
  # 6k x global batch 64 over 5,000 views is about 76.8 passes.
  total_steps: 6000
  effective_batch_size: 64
  micro_batch_size: auto
  batch_candidates: [16, 8, 4, 2, 1]
  memory_headroom_mb: 3000
  amp: true
  amp_dtype: bfloat16
  # 1e-3 became unstable when total_steps was extended to 15k. Start with
  # 3e-4; tune [1e-4, 3e-4, 5e-4] before changing the architecture.
  learning_rate: 0.0003
  first_bottleneck_lr_scale: 0.2
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  optimizer:
    # Supported: stable_adamw, adamw, adam.
    type: stable_adamw
    amsgrad: false
    stable_clip_threshold: 1.0
  scheduler:
    # Supported: cosine, linear, polynomial, constant, step, multistep.
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.05
    step_offset: 1
    # polynomial: power: 2.0
    # step: step_size: 1500, gamma: 0.5
    # multistep: milestones: [2500, 4500], gamma: 0.3
  # A slower, less aggressive Loose Loss avoids locking onto persistent
  # normal edges as the only hard tokens.
  loose_loss_warmup_steps: 2000
  loose_loss_final_discard: 0.7
  generalized_regularization_weight: 0.01
  gradient_clip_norm: 0.1
  gradient_guard:
    # The logged norm is measured before clipping. Skip only catastrophic
    # outliers; after three consecutive skips stop and preserve the last ckpt.
    skip_step_norm: 1.0
    max_consecutive_skips: 3
    fail_on_nonfinite: true
  log_every: 20
  checkpoint_every: 250
  auto_resume: true

evaluation:
  # Used by competition inference; no labels or local metrics are required.
  amp: true
  batch_size: 4
  num_workers: 4
  resize_mask: 448
  image_top_ratio: 0.01
  object_top_ratio: 0.01
  gaussian_kernel_size: 5
  # Sigma 4 spreads a narrow edge response into a wide false-positive halo.
  gaussian_sigma: 2.0
  # Two Loose-Constraint feature groups: reduce the shallow/high-frequency
  # group and emphasize the deeper semantic group. [1, 1] is the old behavior.
  anomaly_map_layer_weights: [0.35, 0.65]
  anomaly_map_align_corners: false
  metric_bins: 1000
  resume: true

# AdaptCLIP-inspired branch trained locally from public OpenAI CLIP base
# weights. It never loads another anomaly model's task-specific checkpoint.
zero_shot:
  enabled: true
  backend: adaptclip_inspired
  route: unseen_only
  # Test_C indicates that the synthetic-loss early best snapshot generalizes
  # worse than completing the fixed training horizon.
  checkpoint: zero_shot_stable/checkpoints/final_model.pt
  model:
    model_name: ViT-L-14-336
    pretrained: openai
    weights_dir: third_party/OpenCLIP/weights
    force_quick_gelu: true
    image_size: 518
    # Keep unseen images at this resolution from disk; the old pipeline first
    # reduced them to 448 and then enlarged them back to 518 inside CLIP.
    dense_output_size: 259
    intermediate_layers: 4
    intermediate_layer_weights: [0.1, 0.2, 0.3, 0.4]
    semantic_temperature: 0.10
    visual_fusion_weight: 0.65
    image_local_weight: 0.35
    image_top_ratio: 0.005
    adapter_hidden_dim: 192
    refiner_hidden_dim: 16
    dropout: 0.1
    compound_prompt_count: 10
    prompt_prior_temperature: 1.0
    frequency_weight: 0.25
    foreground_suppression: 0.35
    foreground_floor: 0.20
    normal_prompts:
      - an intact industrial object
      - a flawless undamaged component
      - a correctly assembled object with all parts present
      - a clean uniform surface without defects
      - a normal object with correct shape and alignment
    broken_prompts:
      - a broken industrial object
      - a cracked fractured or split component
      - a scratched abraded chipped or dented surface
      - a component with missing displaced or incorrectly assembled parts
      - an object with deformation bending or crushing
      - an object with contamination stain glue debris or foreign material
      - an object with corrosion burn discoloration or peeling coating
      - a component with a blocked hole broken wire or bent connector
      - an object with excess material porosity pits or unwanted holes
      - a defective industrial component with a local anomaly
  training:
    total_steps: 5000
    object_batch_size: 2
    num_workers: 4
    amp: true
    amp_dtype: bfloat16
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0.0001
    adam_betas: [0.9, 0.999]
    scheduler: cosine
    warmup_steps: 200
    min_lr_ratio: 0.05
    gradient_clip_norm: 1.0
    focal_gamma: 2.0
    focal_alpha: 0.75
    focal_weight: 1.0
    dice_weight: 1.5
    boundary_weight: 0.5
    image_weight: 0.5
    # Primary image supervision follows the local/global five-view submission
    # statistic before inference-only resizing/smoothing. A per-frame global
    # loss remains as auxiliary supervision for the true CLIP image token.
    global_image_weight: 0.1
    map_object_top_ratio: 0.005
    # The real Test_C report measured mean-view AUROC 0.6908 versus the
    # submitted 0.6718, so train against pure five-view consensus.
    map_object_max_blend: 0.0
    # Add category-agnostic CLIP image-token evidence to the local top-k score.
    map_object_global_weight: 0.10
    # Fixed-horizon selection avoids choosing an early synthetic-loss optimum
    # (the latest run selected step 1560/5000) with no real unseen validation.
    checkpoint_selection: final
    clean_weight: 0.2
    prompt_anchor_weight: 0.001
    prompt_diversity_weight: 0.01
    log_every: 20
    checkpoint_every: 500
    auto_resume: true
  synthesis:
    # Match evaluation semantics: balance normal/anomalous objects, then allow
    # an anomalous object to be invisible in some of its five camera views.
    object_group_size: 5
    object_anomaly_probability: 0.50
    view_anomaly_probability: 0.60
    anomaly_probability: 0.60
    hard_normal_probability: 0.5
    scratch_probability: 0.30
    tiny_probability: 0.35
    ring_probability: 0.15
    min_area_ratio: 0.0002
    max_area_ratio: 0.10
    alpha_min: 0.55
    alpha_max: 1.0
    feature_anomaly_probability: 0.2
    feature_noise_std: 0.04
  inference:
    # Four overlapping crops recover small LED/pin/fuse anomalies which are
    # diluted in a single full-frame CLIP token grid.
    window_enabled: true
    window_size_ratio: 0.65
    window_weight: 0.35


submission:
  mask_size: 448
  batch_size: 4
  num_workers: 4
  object_top_ratio: 0.01
  # Per-category monotonic 8-bit calibration. The extreme upper quantile keeps
  # anomalous peaks from being collapsed while using the PNG range efficiently.
  lower_quantile: 0.001
  upper_quantile: 0.99999
  # Preserve commit 71eebcc's concatenated five-view top-k rule for seen.
  object_score_aggregation: legacy_concat_topk
  # AdaptCLIP unseen scoring remains isolated from the seen path.
  zero_shot_object_max_blend: 0.0
  zero_shot_object_global_weight: 0.10
  zero_shot_object_top_ratio: 0.005
  zero_shot_mask_calibration: per_category
  # Monotonic dynamic-range expansion before uint8 prevents low-amplitude
  # unseen maps from collapsing into nearly all-black PNGs.
  zero_shot_mask_gamma: 0.45

runtime:
  device: cuda:0
  multi_gpu_strategy: auto
  distributed_backend: auto
  device_ids: [0, 1]
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  deterministic: false
