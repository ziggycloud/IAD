experiment:
  name: generalized_dinomaly_competition_seen50_vitl448_20260904
  # Training semantics changed; keep new checkpoints separate from the old run.
  output_dir: outputs/generalized_dinomaly_competition_seen50_vitl448_20260904
  seed: 20260803

dataset:
  type: competition_folders
  train_dir: data/competition/Train
  test_dir: data/competition/Test_A
  categories: all
  category_limit: null
  # Test selection is independent so Test_B may contain unseen categories.
  test_categories: all
  test_category_limit: null
  require_same_categories: true
  expected_categories: 50
  expected_test_categories: 50
  expected_train_samples_per_category: 20
  expected_test_samples_per_category: 15
  image_size: 448
  crop_size: 448
  train_mode: all_views

model:
  # Keep the same category-generalized model used by run_unseen_pipeline.py.
  architecture: category_generalized
  backbone: dinov2reg_vit_large_14
  backbone_weights_dir: third_party/Dinomaly2/backbones/weights
  dropout: 0.2
  linear_attention: true
  loose_constraint_groups: 2
  loose_loss: true
  context_aware_recenter: true
  generalized:
    latent_dim: 384
    num_references: 512
    reference_top_k: 32
    reference_temperature: 0.1
    router_top_k: 3
    router_temperature: 1.0
    router_trim_ratio: 0.1
    expert_dropout: 0.1
    auxiliary_weights:
      reference_balance: 1.0
      router_balance: 1.0
      router_entropy_penalty: 0.05
      expert_diversity: 0.05

training:
  # 5k x global batch 64 over 5,000 views is about 64 passes. This branch
  # trains views independently, so retain a view batch near the current
  # five-view model's 60 views per optimizer step.
  total_steps: 5000
  effective_batch_size: 64
  micro_batch_size: auto
  batch_candidates: [8, 4, 2, 1]
  memory_headroom_mb: 3000
  amp: true
  amp_dtype: bfloat16
  learning_rate: 0.0001
  first_bottleneck_lr_scale: 0.2
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  # Linear warmup followed by one half-cosine decay to 5e-6.
  warmup_steps: 500
  lr_step_offset: 1
  final_lr_ratio: 0.05
  loose_loss_warmup_steps: 1500
  loose_loss_final_discard: 0.7
  generalized_regularization_weight: 0.01
  gradient_clip_norm: 0.5
  log_every: 20
  checkpoint_every: 500
  auto_resume: true

evaluation:
  # Used by competition inference; no labels or local metrics are required.
  amp: true
  batch_size: 2
  num_workers: 4
  resize_mask: 448
  image_top_ratio: 0.01
  object_top_ratio: 0.01
  gaussian_kernel_size: 5
  gaussian_sigma: 2.0
  metric_bins: 1000
  resume: true
  # This branch remains checkpoint-compatible with the baseline. Frozen CLIP
  # is loaded lazily and used only when a test category is absent from Train.
  unseen_clip:
    enabled: true
    model_name: ViT-B-16
    pretrained: openai
    weights_dir: third_party/OpenCLIP/weights
    image_size: 448
    intermediate_layers: 4
    temperature: 0.04
    # A match to any defect concept is enough; unrelated prompts cannot dilute it.
    prompt_aggregation: max
    # Aggressive additive fusion: CLIP can dominate when broken semantics fire.
    reconstruction_gain: 0.5
    semantic_gain: 2.0
    semantic_scale_floor: 0.05
    broken_threshold: 0.35
    # Strongly remove broad unseen-category novelty.
    center_quantile: 0.5
    upper_quantile: 0.995
    global_retention: 0.1
    normal_prompts:
      - a close-up photo of an intact industrial object
      - a normal undamaged component
      - a flawless object surface
      - a complete object without defects
      - a correctly assembled industrial component
      - an object with all parts present
      - a clean object without contamination
      - a component with correct wiring and connections
      - an object with a smooth uniform coating
      - an object with clear complete printed characters
      - a component with open unobstructed holes
      - an object with the correct shape and alignment
    broken_prompts:
      - a close-up photo of a broken industrial object
      - an industrial object with abrasion or a worn surface
      - an industrial object with missing or incomplete printed characters
      - an industrial object with discoloration or abnormal color
      - an industrial object with an exposed inner surface
      - an industrial object contaminated by glue or gelatinous residue
      - an industrial object contaminated by metallic debris
      - an industrial object with a pit or surface cavity
      - an industrial object with a scratch or gouge
      - an industrial object fitted with the wrong plug or wrong component
      - an industrial object with a broken or disconnected wire
      - a visibly damaged industrial component
      - an industrial object with excessive material or material overflow
      - an industrial object with fiber burrs or frayed fibers
      - an industrial object with a blocked or obstructed hole
      - an industrial object with a missing part or absent component
      - an industrial object with porosity, pores, or air holes
      - an industrial object with a twisted or tangled wire
      - an industrial object with a wire jumping out of its correct position
      - an industrial object with a burn mark or heat damage
      - an industrial object with deformation, warping, or bending
      - an industrial object with exposed copper or exposed conductor
      - an industrial object with a fracture, crack, or split
      - an industrial object with impact damage, denting, or crushing
      - an industrial object with an oil stain or greasy contamination
      - an industrial object with uneven coating or patchy paint
      - an industrial object with corrosion, oxidation, or rust
      - an industrial object with peeling, delamination, or flaking
      - an industrial object with a chip, notch, or broken edge
      - an industrial object with a puncture, tear, or unwanted hole
      - an industrial object with a loose connection or detached part
      - an industrial object with a bent pin or misaligned connector
      - an industrial object with foreign material, dirt, or contamination
      - an industrial object with an incorrect assembly or misplaced part

submission:
  mask_size: 448
  batch_size: 2
  num_workers: 4
  object_top_ratio: 0.01
  # Per-category monotonic 8-bit calibration. The extreme upper quantile keeps
  # anomalous peaks from being collapsed while using the PNG range efficiently.
  lower_quantile: 0.001
  upper_quantile: 0.99999

runtime:
  device: cuda:0
  multi_gpu_strategy: auto
  distributed_backend: auto
  device_ids: [0, 1]
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  deterministic: false
