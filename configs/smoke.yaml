experiment:
  name: smoke_dinomaly2_realiad_variety
  output_dir: outputs/smoke_dinomaly2_realiad_variety
  seed: 1

dataset:
  type: realiad_variety
  json_dir: data/realiadvariety_jsons/Real-IAD_Variety_jsons
  image_dir: data/realiadvariety_raw
  train_image_dir: null
  categories: [2pin_block_plug]
  category_limit: 1
  image_size: 280
  crop_size: 280
  train_mode: all_views
  image_label_policy: visible_defect
  missing_anomaly_mask_policy: include_as_normal_view
  mask_resize_semantics: upstream_bilinear_nonzero

model:
  backbone: dinov2reg_vit_base_14
  backbone_weights_dir: third_party/Dinomaly2/backbones/weights
  dropout: 0.4
  linear_attention: true
  loose_constraint_groups: 2
  loose_loss: true
  context_aware_recenter: true

training:
  total_steps: 2
  effective_batch_size: 2
  micro_batch_size: 1
  batch_candidates: [1]
  memory_headroom_mb: 700
  amp: true
  amp_dtype: bfloat16
  learning_rate: 0.002
  first_bottleneck_lr_scale: 0.1
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-10
  warmup_steps: 1
  lr_step_offset: 1
  final_lr_ratio: 0.1
  loose_loss_warmup_steps: 2
  loose_loss_final_discard: 0.9
  gradient_clip_norm: 0.1
  log_every: 1
  checkpoint_every: 1
  auto_resume: false

evaluation:
  amp: false
  batch_size: 1
  num_workers: 0
  resize_mask: 64
  image_top_ratio: 0.01
  object_top_ratio: 0.01
  gaussian_kernel_size: 5
  gaussian_sigma: 4.0
  metric_bins: 100
  resume: false
  max_test_images_per_category: 10

runtime:
  device: cuda:0
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  deterministic: true

cache:
  output_dir: data/realiadvariety_1024
  max_side: 1024
  workers: 2
