base_config: competition.yaml

experiment:
  name: testc_09111clip
  output_dir: outputs/testc_09111clip

testc:
  protocol_file: configs/testc_protocol.json
  sampling_seed: 20260909
  normal_objects_per_category: 10
  anomaly_objects_per_category: 10
  views_per_object: 5
  image_top_ratio: 0.01
  recommended_checkpoint_steps: 6000
  recommended_zero_shot_steps: 5000
  # Non-primary torchrun ranks wait here while rank 0 completes the independent
  # CLIP stage; high-resolution 5k-step training can exceed the old 2h default.
  inference_rendezvous_timeout_seconds: 43200
  data_root: auto

latency:
  enabled: false
  warmup_iterations: 10
  measure_iterations: 50
  threshold_seconds: 1.0
